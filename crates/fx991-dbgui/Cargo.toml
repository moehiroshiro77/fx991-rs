[package]
name = "fx991-dbgui"
description = "fx-991CN X window debugger: the x64dbg-shaped panels, composed on the CPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fx991 = { workspace = true }
fx991-dbg = { workspace = true }
fx991-ui = { workspace = true }
fx991-bus = { workspace = true }
fx991-chipset = { workspace = true }
nxu8-core = { workspace = true }
nxu8-asm = { workspace = true }
# Glyph rasterisation only: the crate composites panels into the same RGBA frame
# the calculator face uses, so it needs no window and no GPU.
ab_glyph = "0.2"

[dev-dependencies]
testkit = { workspace = true }
